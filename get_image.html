<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>دریافت تصویر</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            width: 80%;
        }
        .preview {
            margin-top: 20px;
            max-width: 100%;
        }
        img {
            max-width: 200px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            background: #e0e0e0;
            border-radius: 8px;
            font-size: 12px;
        }
        .note {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📥 دریافت تصویر ذخیره شده</h2>
        <button onclick="getAndSendImage()">📥 دانلود تصویر</button>
        <div class="preview" id="preview"></div>
        <div class="status" id="status">در انتظار اقدام شما...</div>
        <div class="note">
            ⚠️ پس از دانلود، لطفاً تصویر را در چت ربات ارسال کنید.
        </div>
    </div>

    <script>
        function getAndSendImage() {
            const statusDiv = document.getElementById('status');
            const imageData = localStorage.getItem('digit_image');
            
            if (!imageData) {
                statusDiv.innerHTML = '❌ هیچ تصویری ذخیره نشده است! لطفاً ابتدا یک رقم بنویسید.';
                alert('❌ هیچ تصویری ذخیره نشده است! لطفاً ابتدا روی ✍️ نوشتن رقم کلیک کنید و یک عدد بنویسید.');
                return;
            }
            
            // نمایش پیش‌نمایش
            const preview = document.getElementById('preview');
            preview.innerHTML = `<img src="${imageData}" alt="پیش‌نمایش">`;
            
            statusDiv.innerHTML = '✅ تصویر پیدا شد. در حال دانلود...';
            
            // دانلود تصویر
            const link = document.createElement('a');
            link.download = 'digit.png';
            link.href = imageData;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            statusDiv.innerHTML = '✅ تصویر دانلود شد! لطفاً آن را در چت ربات ارسال کنید.';
            
            // بستن خودکار صفحه بعد از 3 ثانیه
            setTimeout(() => {
                if (typeof BaleWebApp !== 'undefined' && typeof BaleWebApp.close === 'function') {
                    BaleWebApp.close();
                } else if (typeof window.close === 'function') {
                    window.close();
                }
            }, 3000);
        }
    </script>
</body>
</html>
