<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>تست postEvent</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 20px; max-width: 600px; margin: 0 auto; }
        button { padding: 15px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px; width: 100%; }
        .debug-box { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 10px; font-family: monospace; font-size: 12px; margin-top: 20px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🧪 تست postEvent</h2>
        <button onclick="testFormat1()">📤 فرمت 1: (data)</button>
        <button onclick="testFormat2()">📤 فرمت 2: ('event', data)</button>
        <button onclick="testFormat3()">📤 فرمت 3: ('send_data', data)</button>
        <button onclick="testFormat4()">📤 فرمت 4: ('web_app_data', data)</button>
        <button onclick="testFormat5()">📤 فرمت 5: (data, callback)</button>
        <div class="debug-box" id="debugLog">در حال آماده‌سازی...</div>
    </div>

    <script>
        function log(msg, isError = false) {
            const debugDiv = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString();
            const className = isError ? 'error' : 'success';
            debugDiv.innerHTML += `<div class="${className}">[${time}] ${msg}</div>`;
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }

        function getImageData() {
            const imageData = localStorage.getItem('digit_image');
            if (!imageData) {
                log('❌ تصویری در localStorage یافت نشد! ابتدا یک رقم بنویسید.', true);
                return null;
            }
            log('✅ تصویر از localStorage خوانده شد');
            return imageData;
        }

        function sendWithPostEvent(methodName, arg1, arg2 = null) {
            try {
                log(`📤 تلاش: ${methodName}(${JSON.stringify(arg1).substring(0, 50)}...)`);
                if (arg2 !== null) {
                    BaleWebApp.postEvent(arg1, arg2);
                } else {
                    BaleWebApp.postEvent(arg1);
                }
                log(`✅ ${methodName} اجرا شد - بدون خطا`, false);
                return true;
            } catch(e) {
                log(`❌ ${methodName} خطا: ${e.message}`, true);
                return false;
            }
        }

        function testFormat1() {
            log('=== تست فرمت 1: فقط داده ===');
            const imageData = getImageData();
            if (!imageData) return;
            sendWithPostEvent('فرمت 1', imageData);
        }

        function testFormat2() {
            log('=== تست فرمت 2: رویداد + داده ===');
            const imageData = getImageData();
            if (!imageData) return;
            sendWithPostEvent('فرمت 2', 'digit_image', imageData);
        }

        function testFormat3() {
            log('=== تست فرمت 3: send_data + داده ===');
            const imageData = getImageData();
            if (!imageData) return;
            sendWithPostEvent('فرمت 3', 'send_data', imageData);
        }

        function testFormat4() {
            log('=== تست فرمت 4: web_app_data + داده ===');
            const imageData = getImageData();
            if (!imageData) return;
            sendWithPostEvent('فرمت 4', 'web_app_data', imageData);
        }

        function testFormat5() {
            log('=== تست فرمت 5: داده + تابع برگشتی ===');
            const imageData = getImageData();
            if (!imageData) return;
            try {
                BaleWebApp.postEvent(imageData, function(response) {
                    log(`پاسخ از WebView: ${JSON.stringify(response)}`);
                });
                log('✅ فرمت 5 اجرا شد');
            } catch(e) {
                log(`❌ فرمت 5 خطا: ${e.message}`, true);
            }
        }

        // نمایش وضعیت اولیه
        window.onload = function() {
            log('🔍 صفحه دیباگ loaded');
            if (typeof BaleWebApp !== 'undefined') {
                log('✅ BaleWebApp پیدا شد');
                log(`📋 متدهای موجود: postEvent`);
            } else {
                log('❌ BaleWebApp پیدا نشد!', true);
            }
            
            const imageData = localStorage.getItem('digit_image');
            if (imageData) {
                log('✅ تصویر در localStorage وجود دارد');
            } else {
                log('⚠️ تصویری در localStorage یافت نشد. ابتدا یک رقم بنویسید.', true);
            }
        };
    </script>
</body>
</html>
