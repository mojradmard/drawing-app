<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>دریافت تصویر</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            max-width: 400px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        .preview {
            margin-top: 20px;
            max-width: 100%;
        }
        img {
            max-width: 200px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📥 دریافت تصویر ذخیره شده</h2>
        <button onclick="getAndSendImage()">📤 ارسال تصویر به ربات</button>
        <div class="preview" id="preview"></div>
    </div>

    <script>
        function getAndSendImage() {
            // خواندن تصویر از localStorage
            const imageData = localStorage.getItem('digit_image');
            
            if (!imageData) {
                alert('❌ هیچ تصویری ذخیره نشده است! لطفاً ابتدا یک رقم بنویسید.');
                return;
            }
            
            // نمایش پیش‌نمایش
            const preview = document.getElementById('preview');
            preview.innerHTML = `<img src="${imageData}" alt="پیش‌نمایش">`;
            
            // ارسال به ربات
            if (typeof BaleWebApp !== 'undefined') {
                BaleWebApp.sendData(JSON.stringify({
                    image: imageData
                }));
                
                alert('✅ تصویر به ربات ارسال شد!');
                
                // بستن WebView
                setTimeout(() => {
                    if (typeof BaleWebApp.close === 'function') {
                        BaleWebApp.close();
                    }
                }, 500);
            } else {
                alert('در حال ارسال... (محیط WebView شناسایی نشد)');
                console.log('Image data:', imageData.substring(0, 100));
            }
        }
    </script>
</body>
</html>
