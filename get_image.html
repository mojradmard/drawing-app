<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>دریافت تصویر</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; margin: 0; }
        .container { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 20px; text-align: center; max-width: 400px; width: 100%; }
        button { padding: 15px 30px; font-size: 18px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px; width: 80%; }
        .share-btn { background: #2196F3; }
        .preview { margin-top: 20px; max-width: 100%; }
        img { max-width: 200px; border: 1px solid #ddd; border-radius: 8px; }
        .status { margin-top: 10px; padding: 10px; background: #e0e0e0; border-radius: 8px; font-size: 12px; }
        .note { margin-top: 15px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📥 دریافت تصویر ذخیره شده</h2>
        <button onclick="shareImage()" class="share-btn">📤 اشتراک‌گذاری تصویر</button>
        <button onclick="downloadImage()">💾 دانلود تصویر</button>
        <div class="preview" id="preview"></div>
        <div class="status" id="status">در انتظار اقدام شما...</div>
        <div class="note">
            💡 روش کار:<br>
            1. روی اشتراک‌گذاری کلیک کنید<br>
            2. بله را انتخاب کنید<br>
            3. تصویر را در چت ربات ارسال کنید
        </div>
    </div>

    <script>
        window.onload = function() {
            const imageData = localStorage.getItem('digit_image');
            if (imageData) {
                document.getElementById('preview').innerHTML = `<img src="${imageData}" alt="پیش‌نمایش">`;
                document.getElementById('status').innerHTML = '✅ تصویر پیدا شد. روی دکمه اشتراک‌گذاری کلیک کنید.';
            } else {
                document.getElementById('status').innerHTML = '⚠️ هیچ تصویری ذخیره نشده است. ابتدا یک رقم بنویسید.';
            }
        };

        function shareImage() {
            const imageData = localStorage.getItem('digit_image');
            if (!imageData) {
                alert('❌ هیچ تصویری ذخیره نشده است!');
                return;
            }

            fetch(imageData)
                .then(res => res.blob())
                .then(blob => {
                    const file = new File([blob], "digit.png", { type: "image/png" });
                    
                    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({
                            title: 'رقم دستنویس',
                            files: [file]
                        }).then(() => {
                            document.getElementById('status').innerHTML = '✅ تصویر ارسال شد! لطفاً آن را در چت ربات انتخاب کنید.';
                        }).catch((e) => {
                            if (e.name !== 'AbortError') {
                                alert('خطا در اشتراک‌گذاری: ' + e.message);
                            }
                        });
                    } else {
                        downloadImage();
                    }
                });
        }

        function downloadImage() {
            const imageData = localStorage.getItem('digit_image');
            if (!imageData) {
                alert('❌ هیچ تصویری ذخیره نشده است!');
                return;
            }
            
            const link = document.createElement('a');
            link.download = 'digit.png';
            link.href = imageData;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            document.getElementById('status').innerHTML = '✅ تصویر دانلود شد! لطفاً آن را در چت ربات ارسال کنید.';
        }
    </script>
</body>
</html>
