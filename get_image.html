<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ارسال تصویر به ربات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            width: 80%;
        }
        .preview {
            margin-top: 20px;
            max-width: 100%;
        }
        img {
            max-width: 200px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            background: #e0e0e0;
            border-radius: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📤 ارسال تصویر به ربات</h2>
        <button onclick="sendToBot()">📤 ارسال خودکار به ربات</button>
        <div class="preview" id="preview"></div>
        <div class="status" id="status">در حال آماده‌سازی...</div>
    </div>

    <script>
        window.onload = function() {
            const imageData = localStorage.getItem('digit_image');
            if (imageData) {
                document.getElementById('preview').innerHTML = `<img src="${imageData}" alt="پیش‌نمایش">`;
                document.getElementById('status').innerHTML = '✅ تصویر پیدا شد. روی دکمه کلیک کنید.';
            } else {
                document.getElementById('status').innerHTML = '⚠️ هیچ تصویری ذخیره نشده است.';
            }
        };

        function sendToBot() {
            const imageData = localStorage.getItem('digit_image');  // 👈 خواندن از localStorage
            
            if (!imageData) {
                alert('❌ هیچ تصویری ذخیره نشده است!');
                return;
            }
            
            if (typeof BaleWebApp !== 'undefined') {
                BaleWebApp.sendData(JSON.stringify({
                    type: 'digit_image',
                    data: imageData
                }));
                BaleWebApp.close();
            }
        }
    </script>
</body>
</html>
